<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiido T2 passenger hand warmer — design</title>
<style>
  :root { --ink:#1d232a; --muted:#5d6b78; --line:#d7dde3; --bg:#fbfcfd; --accent:#2f6db5; }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); margin: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { font-size: 18px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 64px); }
  aside { border-right: 1px solid var(--line); padding: 12px 14px; background: #fff; overflow-y: auto; max-height: calc(100vh - 64px); position: sticky; top: 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px; padding: 6px 10px 8px; }
  legend { font-weight: 600; padding: 0 4px; }
  fieldset label { display: grid; grid-template-columns: 1fr 72px 16px; gap: 6px; align-items: center; margin: 4px 0; }
  fieldset label small { color: var(--muted); }
  fieldset label select { grid-column: 2 / 4; }
  input[type=number] { width: 72px; padding: 2px 4px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #error { color: #b00020; min-height: 1.2em; margin: 4px 0; }
  #stats, #frameSource { color: var(--muted); font-size: 12px; }
  main { padding: 10px 20px 40px; min-width: 0; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; flex-wrap: wrap; }
  nav button { border: 1px solid transparent; border-bottom: none; background: none; padding: 8px 12px; cursor: pointer; border-radius: 6px 6px 0 0; font: inherit; }
  nav button[aria-selected=true] { border-color: var(--line); background: #fff; font-weight: 600; color: var(--accent); margin-bottom: -1px; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: system-ui, sans-serif; }
  .drag { cursor: grab; border: 1px solid var(--line); border-radius: 6px; background: #fff; touch-action: none; }
  .drag svg { max-height: 62vh; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 6px; }
  figcaption { color: var(--muted); font-size: 12px; padding-top: 4px; }
  figure.mini { max-width: 420px; margin-top: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .hint, .note { color: var(--muted); font-size: 12px; }
  .warn { color: #8a5a00; background: #fff6e0; border: 1px solid #f0d9a0; padding: 6px 10px; border-radius: 6px; }
  .slider { display: flex; gap: 10px; align-items: center; margin: 6px 0 10px; }
  .slider input { flex: 1; max-width: 460px; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0 18px; font-size: 13px; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
  th { background: #f2f5f8; }
  td.bad { color: #b00020; font-weight: 600; }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  .legend { font-size: 13px; }
  .sheet { border: 1px solid var(--line); background: #fff; margin-top: 10px; max-width: 700px; }
  [data-edge] { transition: stroke-width .1s; }
  [data-edge].hl { stroke-width: 7 !important; stroke-opacity: 1 !important; }
  .banner { font-size: 12px; color: #8a5a00; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { position: static; max-height: none; } .grid2, .grid3 { grid-template-columns: 1fr; } }
</style>
<header>
  <h1>Fiido T2 passenger hand warmer</h1>
  <p class="banner">⚠ Experimental sewing prototype. Every frame dimension is an estimate from manufacturer images; measure the real bike before cutting. Do not ride with an unvalidated prototype.</p>
</header>
<div class="layout">
  <aside>
    <form id="controls"></form>
    <p id="error" role="alert"></p>
    <p id="stats"></p>
    <p id="frameSource"></p>
    <button type="button" id="reset">Reset all values</button>
  </aside>
  <main>
    <nav role="tablist">
      <button type="button" data-tab="installed">Installed</button>
      <button type="button" data-tab="section">Cross-section</button>
      <button type="button" data-tab="exploded">Exploded</button>
      <button type="button" data-tab="coord">Assembled ↔ flat</button>
      <button type="button" data-tab="compare">Compare</button>
      <button type="button" data-tab="pattern">Printable pattern</button>
    </nav>
    <div id="view"><div id="viewControls"></div><div id="viewBody"></div></div>
  </main>
</div>
<script type="module" src="./src/app.mjs"></script>
</html>
