<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiido canopy pattern</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}label{display:flex;justify-content:space-between;margin:12px 0}input{width:85px}svg{width:100%;height:auto}button{padding:10px}#error{color:#a00}</style><h1>Fiido T2 passenger canopy</h1><p>Unverified prototype dimensions in mm. Open-bottom canopy; measure actual grip and rail before cutting.</p><main><section><form id="form"></form><p id="stats"></p><p id="error" role="alert"></p><button id="save">Download full-size SVG</button><p>Print at 100%; verify calibration square. No A4 tiling yet.</p></section><section id="preview"></section></main><script type="module">
import {pattern,svg} from './src/geometry.mjs';
const defaults={length:180,radius:65,seam:10,tube:25,overlap:35,strapWidth:25,lining:4};
const names={length:'Canopy length',radius:'Canopy radius',seam:'Seam allowance',tube:'Tube diameter',overlap:'Strap overlap',strapWidth:'Webbing width',lining:'Lining thickness'};
const form=document.querySelector('#form'),save=document.querySelector('#save');let output='';
for(const [k,v] of Object.entries(defaults)){const label=document.createElement('label');label.textContent=names[k];const input=document.createElement('input');input.type='number';input.min='1';input.max='1000';input.step='any';input.name=k;input.value=v;label.append(input);form.append(label)}
function update(){try{const p=pattern(Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)])));output=svg(p);document.querySelector('#preview').innerHTML=output;document.querySelector('#stats').textContent='Matching curved seam: '+p.arc.toFixed(1)+' mm; nominal lined radius: '+p.internalRadius+' mm; strap blank: '+p.strapLength.toFixed(1)+' mm.';document.querySelector('#error').textContent='';save.disabled=false}catch(e){output='';document.querySelector('#preview').replaceChildren();document.querySelector('#stats').textContent='';document.querySelector('#error').textContent=e.message;save.disabled=true}}
form.addEventListener('input',update);form.addEventListener('submit',e=>e.preventDefault());save.onclick=()=>{const url=URL.createObjectURL(new Blob([output],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='fiido-canopy.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();
</script></html>
